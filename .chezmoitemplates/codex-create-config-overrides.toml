model = "{{ .llmmodel }}"
review_model = "{{ .llmmodel }}"
model_provider = "litellm"
suppress_unstable_features_warning = true
model_reasoning_effort = "low"

[model_providers.litellm]
name = "LiteLLM"
base_url = "{{ .llmurl }}/v1"
http_headers = { "Authorization" = "Bearer {{ .llmkey }}" }
wire_api = "responses"
model_catalog_url = "{{ .llmurl }}/v1/models"

[agents]
max_concurrent_threads_per_session = 2

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
http_headers = { "Authorization" = "Bearer {{ .ghpatmcp }}" }

[desktop]
followUpQueueMode = "steer"
preventSleepWhileRunning = true
enabled-reasoning-efforts = ["low", "high", "persistent", "max"]

[marketplaces.mattpocock]
source_type = "git"
source = "https://github.com/mattpocock/skills.git"

[features]
guardian_approval = true
default_mode_request_user_input = true
memories = true
api_key_model_discovery = true

[memories]
generate_memories = true
use_memories = true

{{- /* chezmoi:modify-template */ -}}
{{- $stdin := trim .chezmoi.stdin -}}
{{- $current := dict -}}
{{- if ne $stdin "" -}}
{{- $current = $stdin | fromToml -}}
{{- end -}}
{{- $overrides := includeTemplate "codex-create-config-overrides.toml" . | fromToml -}}
{{- $merged := mustMergeOverwrite $current $overrides -}}
{{- if and (hasKey $merged "model_providers") (hasKey $merged.model_providers "litellm") -}}
{{- $provider := $merged.model_providers.litellm -}}
{{- $_ := unset $provider "env_key" -}}
{{- $_ := unset $provider "api_key" -}}
{{- end -}}
{{- toToml $merged }}
